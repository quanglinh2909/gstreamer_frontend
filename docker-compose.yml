services:
  nginx:
    image: nginx:1.27-alpine
    container_name: gstreamer-nginx
    restart: unless-stopped
    # network_mode: host để nginx proxy thẳng tới 127.0.0.1:<port> của
    # frontend/backend đang chạy trên máy host. Với chế độ này, khai báo
    # "ports:" bị bỏ qua — cổng lắng nghe là NGINX_PORT trong file conf.
    network_mode: host
    environment:
      # Cổng public custom (không dùng 80/443). Đổi tại đây hoặc trong .env.
      NGINX_PORT: ${NGINX_PORT:-8088}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      PY_BACKEND_PORT: ${PY_BACKEND_PORT:-8010}
      CPP_BACKEND_PORT: ${CPP_BACKEND_PORT:-8009}
      # MoQ đi trên QUIC = UDP, khối http bên dưới KHÔNG chuyển tiếp được.
      # nginx bind cổng UDP công khai (443 cho dễ qua tường lửa) rồi đẩy về
      # cổng mà máy chủ MoQ đang nghe. Xem nginx/moq.stream-template.
      # Cổng HTTPS cho LAN — bắt buộc phải có để dùng MoQ trong mạng nội bộ
      # (WebTransport chỉ chạy ở secure context). Xem nginx/make-lan-cert.sh.
      NGINX_TLS_PORT: ${NGINX_TLS_PORT:-8443}
      MOQ_PUBLIC_UDP_PORT: ${MOQ_PUBLIC_UDP_PORT:-443}
      MOQ_PORT: ${MOQ_PORT:-4443}
      # Chỉ cho envsubst thay các biến này, tránh đụng vào biến runtime của
      # nginx ($host, $http_upgrade, ...).
      NGINX_ENVSUBST_FILTER: "^(NGINX_PORT|NGINX_TLS_PORT|FRONTEND_PORT|PY_BACKEND_PORT|CPP_BACKEND_PORT|MOQ_PUBLIC_UDP_PORT|MOQ_PORT)$$"
    volumes:
      # Template được envsubst -> /etc/nginx/conf.d/default.conf khi khởi động.
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      # *.stream-template -> /etc/nginx/stream-conf.d/, và entrypoint tự thêm
      # khối `stream { ... }` vào nginx.conf. Không phải sửa nginx.conf tay.
      # Tên phải là *.conf.stream-template: entrypoint chỉ cắt đuôi
      # ".stream-template", mà khối stream lại include "*.conf" — đặt tên
      # thiếu ".conf" thì file được sinh ra nhưng KHÔNG bao giờ được nạp.
      - ./nginx/moq.conf.stream-template:/etc/nginx/templates/moq.conf.stream-template:ro
      # Chứng chỉ tự ký cho cổng HTTPS nội bộ (nginx/make-lan-cert.sh).
      - ./nginx/certs:/etc/nginx/certs:ro
